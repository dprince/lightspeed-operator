---
# govulncheck_ignore_list_expiry_date enforces periodic review of this ignore list.
# Once the expiry date passes, it must be manually extended.
#
# IMPORTANT: Before updating this date (allowed maximum 3 months from today), do
# the following:
#   1. Remove any entry whose vulnerability is no longer detected in the code.
#   2. For remaining entries, re-confirm the risk acceptance is still valid.
#      New call paths to the vulnerable function may have been introduced since
#      the entry was last reviewed.
govulncheck_ignore_list_expiry_date: "2026-11-13"

ignored_vulnerabilities:
  - id: GO-2026-5037
    module: stdlib
    reason: |
      To exploit it, an attacker would need to control or intercept the TLS connection
      to the Kubernetes API endpoint (MitM, DNS spoofing, or a compromised endpoint).
      If they're already in that position, credential theft from the API would
      be a bigger concern. The impact is CPU exhaustion on a single reconcile loop.
    traces:
      - >-
        "#1: test/utils/utils.go:56:21: utils.Run calls fmt.Fprintf, which eventually
        calls x509.Certificate.Verify"
      - >-
        "#2: test/utils/utils.go:56:21: utils.Run calls fmt.Fprintf, which eventually
        calls x509.Certificate.VerifyHostname"
      - >-
        "#3: internal/controller/openstacklightspeed_controller.go:167:12:
        controller.OpenStackLightspeedReconciler.Reconcile calls logr.Logger.Error,
        which eventually calls x509.HostnameError.Error"

  - id: GO-2026-5038
    module: stdlib
    reason: |
      To exploit it, an attacker would need to control or intercept the TLS connection
      to the Kubernetes API server (MitM, DNS spoofing, or a compromised endpoint) and
      inject a crafted RFC 2047 encoded word into an HTTP response header. If they're
      already in that position, full cluster access would be a bigger concern. The
      impact is CPU exhaustion on a single reconcile loop, not data exposure or
      privilege escalation.
    traces:
      - >-
        "#1: internal/controller/openstacklightspeed_controller.go:370:15:
        controller.OpenStackLightspeedReconciler.NotifyAllOpenStackLightspeeds calls
        client.client.List, which eventually calls
        mime.WordDecoder.DecodeHeader"

  - id: GO-2026-5039
    module: stdlib
    reason: |
      The vulnerable textproto.Reader.ReadMIMEHeader is reached only through the
      Kubernetes API client's HTTP layer. To exploit this, an attacker would need
      to MitM or compromise the K8s API server and inject crafted response headers.
      Anyone already in that position has cluster-admin access and far more impactful
      attack vectors. Error messages go to operator logs only, not to user-visible
      surfaces.
    traces:
      - >-
        "#1: test/utils/utils.go:49:21: utils.Run calls fmt.Fprintf,
        which eventually calls textproto.Reader.ReadMIMEHeader"

  - id: GO-2026-5026
    module: stdlib
    reason: |
      This operator does not perform host validation or domain-based access control
      on its side. It only makes outbound calls to the Kubernetes API server, whose
      address is set by cluster infrastructure (in-cluster env vars or admin-controlled
      kubeconfig). No user-supplied or attacker-controlled hostnames are involved,
      so the bypass has no exploitable effect here.
    traces:
      - >-
        "#1: internal/controller/openstacklightspeed_controller.go:370:15:
        controller.OpenStackLightspeedReconciler.NotifyAllOpenStackLightspeeds calls
        client.client.List, which eventually calls
        http.Client.Do"

  - id: GO-2026-5972
    module: stdlib
    reason: |
      The vulnerable asn1.Unmarshal is reached only through x509.ParseCertificate
      in getCertsFromPEM. PEM data comes exclusively from: (1) the operator pod's
      own filesystem CA bundle, (2) system-managed ConfigMaps (openshift-service-ca.crt,
      kube-root-ca.crt) controlled by cluster system operators, and (3) an optional
      user-supplied TLSCACertBundle ConfigMap. To inject a crafted certificate an
      attacker would need at minimum namespace write access at that level they have
      far more impactful vectors (deleting the operator deployment, modifying CRs)
      than crashing it via a malformed cert.
    traces:
      - >-
        "#1: internal/controller/ca_bundle.go:76:44: controller.caBundle.getCertsFromPEM
        calls x509.ParseCertificate, which eventually calls asn1.Unmarshal"

  - id: GO-2026-6089
    module: stdlib
    reason: |
      This code lives exclusively in test/utils/utils.go.
    traces:
      - >-
        "#1: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName calls
        exec.Command, which eventually calls http.Server.ListenAndServe"
      - >-
        "#2: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName calls
        exec.Command, which eventually calls http.Server.Serve"

  - id: GO-2026-5856
    module: stdlib
    reason: |
      ECH is opt-in in Go's crypto/tls and requires explicitly setting
      tls.Config.EncryptedClientHelloConfigList. This field is never set anywhere
      in this codebase, so ECH is never activated.
    traces:
      - >-
        "#1: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName calls
        exec.Command, which eventually calls tls.Conn.HandshakeContext"
      - >-
        "#2: test/utils/utils.go:55:35: utils.Run calls exec.Cmd.CombinedOutput,
        which eventually calls tls.Conn.Read"
      - >-
        "#3: test/utils/utils.go:56:21: utils.Run calls fmt.Fprintf, which calls
        tls.Conn.Write"
      - >-
        "#4: internal/controller/openstacklightspeed_controller.go:370:15:
        controller.OpenStackLightspeedReconciler.NotifyAllOpenStackLightspeeds calls
        client.client.List, which eventually calls
        tls.Dialer.DialContext"

  - id: GO-2026-6090
    module: stdlib
    reason: |
      All production TLS connections are outbound client connections to the Kubernetes
      API server (cluster-controlled). The
      operator never acts as a TLS server accepting post-handshake messages from
      untrusted peers, so the post-handshake message flooding vector does not apply.
      To exploit this, an attacker would need to control or intercept the TLS server
      side (MitM, DNS spoofing, or a compromised endpoint). At that level of access,
      cluster-admin takeover and credential theft are far more impactful attacks than
      resource exhaustion of a single reconcile loop.
    traces:
      - >-
        "#1: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName calls
        exec.Command, which eventually calls tls.Conn.HandshakeContext"
      - >-
        "#2: test/utils/utils.go:55:35: utils.Run calls exec.Cmd.CombinedOutput,
        which eventually calls tls.Conn.Read"
      - >-
        "#3: test/utils/utils.go:56:21: utils.Run calls fmt.Fprintf, which calls
        tls.Conn.Write"
      - >-
        "#4: internal/controller/openstacklightspeed_controller.go:370:15:
        controller.OpenStackLightspeedReconciler.NotifyAllOpenStackLightspeeds calls
        client.client.List, which eventually calls
        tls.Dialer.DialContext"

  - id: GO-2026-6091
    module: stdlib
    reason: |
      This code lives exclusively in test/utils/utils.go.
    traces:
      - >-
        "#1: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName calls
        exec.Command, which eventually calls template.Template.Execute"
      - >-
        "#2: test/utils/utils.go:114:21: utils.LoadImageToKindClusterWithName
        calls exec.Command, which eventually calls template.Template.ExecuteTemplate"

  - id: GO-2026-6218
    module: stdlib
    reason: |
      The URL is constructed entirely by the k8s client library from the Secret's
      namespace and name. There is no reasonable path for an attacker to inject
      a URL or control the parsed path segments without first compromising the
      cluster (at which point this vulnerability is the least of our concerns).
    traces:
      - >-
        "#1: internal/controller/openstacklightspeed_controller.go:370:15:
        controller.OpenStackLightspeedReconciler.NotifyAllOpenStackLightspeeds calls
        client.client.List, which eventually calls
        url.URL.Parse"

  - id: GO-2026-6599
    module: stdlib
    reason: |
      This affects JavaScript escaping in html/template. The reported paths
      originate in test utilities; production templates use text/template for
      configuration files. The operator does not render the affected HTML/JavaScript.

  - id: GO-2026-6600
    module: stdlib
    reason: |
      This is another html/template JavaScript escaping flaw, involving yield.
      The reported paths originate in test utilities, with no affected production
      HTML rendering.

  - id: GO-2026-6603
    module: stdlib
    reason: |
      The attack exhausts an HTTP/2 server's memory through declared trailers.
      cmd/main.go defaults --enable-http2 to false. Outbound HTTP clients do
      not expose this server-side flaw. Reconsider the ignore if HTTP/2 is enabled.

  - id: GO-2026-6605
    module: stdlib
    reason: |
      Exploitation requires an outbound HTTP/1 CONNECT request with a nonempty
      body, potentially poisoning a shared connection. The operator makes
      Kubernetes/OpenStack API requests and does not forward attacker-controlled
      CONNECT requests through a reverse proxy. Ordinary HTTPS proxy tunneling
      does not supply that body.

  - id: GO-2026-6607
    module: stdlib
    reason: |
      This requires server-side Encrypted Client Hello processing. The operator
      does run TLS servers, but neither EncryptedClientHelloKeys nor
      GetEncryptedClientHelloKeys is configured, so the affected ECH processing
      is inactive.

  - id: GO-2026-6608
    module: stdlib
    reason: |
      This vulnerability requires parsing an inbound multipart/form-data request.
      The operator exposes JSON admission, health/readiness, and metrics endpoints;
      none parse multipart forms. The pprof handler identified by the static scan
      is not exposed by this operator.

  - id: GO-2026-6610
    module: stdlib
    reason: |
      Response smuggling requires forwarding malformed HTTP/2 response headers
      to an HTTP/1 client. The operator consumes API responses itself and does
      not act as that reverse proxy, so the required forwarding path is absent.

  - id: GO-2026-6611
    module: stdlib
    reason: |
      This temporary ignore accepts a very low residual availability risk until upgrading
      Go. The operator connects only to TLS-authenticated Kubernetes endpoints.
      Exploitation requires an attacker to control or impersonate one of those
      trusted endpoints and negotiate HTTP/2; an ordinary workload cannot do this.
      A malicious peer could consume CPU with SETTINGS frames, but Go's HTTP/2
      client disables server push, so it cannot create streams itself; work is
      limited to the operator's own concurrent API requests.

  - id: GO-2026-6612
    module: stdlib
    reason: |
      This bypasses an HTTP/2 server's connection-level receive limit using
      stream resets. The current webhook/metrics configuration disables the
      required protocol. Reconsider if --enable-http2=true is used.

  - id: GO-2026-6613
    module: stdlib
    reason: |
      Exploitation requires an HTTP-aware proxy in front of the operator that accepts
      CONNECT and applies a policy that can be bypassed after a 2xx CONNECT response.
      The shipped deployment has no such proxy: health is a kubelet probe and the
      webhook is an internal ClusterIP Service called by the Kubernetes API server.
      This is not applicable as shipped; reassess if a proxy or service mesh exposes
      these endpoints.

  - id: GO-2026-6617
    module: stdlib
    reason: |
      This crashes an HTTP/2 server through concurrent HPACK encoder changes.
      The current HTTP/1.1-only server configuration prevents the trigger;
      outbound clients are not affected by this server-specific race.

  - id: GO-2026-6809
    module: stdlib
    reason: |
      Temporary CI-unblock exception only. The required Go 1.26.10+
      update is tracked in an open follow-up ticket and this will be resolved.
