# Assert console containerImage update is applied to the deployment.
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-console-plugin
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      initContainers:
        - name: rewrite-locales
          image: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9:1.0.12
      containers:
        - name: lightspeed-console-plugin
          image: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9:1.0.12
---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
spec:
  console:
    containerImage: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9:1.0.12
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Setup complete
    - type: OpenStackLightspeedMCPServerReady
      status: "True"
      message: "RHOSO MCP server is disabled (rhoso_mcps feature flag not set)"
    - type: OpenStackLightspeedOKPMCPReady
      status: "True"
      message: "OKP MCP server is ready"
    - type: OpenStackLightspeedReady
      status: "True"
      reason: Ready
      message: OpenStack Lightspeed created
