---
apiVersion: v1
kind: Secret
metadata:
  name: openstack-lightspeed-apitoken-update
  namespace: openstack-lightspeed
type: Opaque
stringData:
  apitoken: xxx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-lightspeed-cert-update
  namespace: openstack-lightspeed
---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
spec:
  llmEndpoint: http://mock-llm-api-server-pod-UPDATE:8000/v1
  llmEndpointType: rhoai_vllm
  llmCredentials: openstack-lightspeed-apitoken-update
  modelName: ibm-granite/granite-3.1-8b-instruct-UPDATE
  tlsCACertBundle: openstack-lightspeed-cert-update
  llmProjectID: test-project-id-UPDATE
  llmDeploymentName: test-deployment-name-UPDATE
  llmAPIVersion: v1.1
  dataverseExporter:
    feedback:
      enabled: false
    transcripts:
      enabled: false
    logLevel: ERROR
  ogx:
    logLevel: "core=debug,providers=info"
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "9Gi"
  lcore:
    logLevel: ERROR
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "3Gi"
  console:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "300Mi"
  database:
    resources:
      requests:
        cpu: "30m"
        memory: "300Mi"
      limits:
        cpu: "500m"
        memory: "3Gi"
  okp:
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "5Gi"
