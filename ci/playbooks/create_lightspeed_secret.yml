---
# Create the token Secret in-cluster so the install hook consumes it during
# `run`. An in-cluster Secret is the only hand-off that survives: a job var is
# out of scope at serialization, set_fact doesn't cross the pre-run boundary,
# and a params file gets published by log collection. Uses `oc` because
# ci-framework's `kubernetes` lib is absent on `crc`.
- name: Pre-create the OpenStack Lightspeed API token Secret
  hosts: crc
  gather_facts: false
  vars:
    _lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    _lightspeed_secret_name: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
  tasks:
    - name: Ensure the OpenStack Lightspeed namespace exists
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create namespace {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
      no_log: true

    - name: Create/refresh the LLM API token Secret
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create secret generic {{ _lightspeed_secret_name }}
          --from-file=apitoken=/dev/stdin
          -n {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
        stdin: "{{ openai_credentials.api_token }}"
      no_log: true
