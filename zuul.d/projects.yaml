---
- project:
    name: openstack-k8s-operators/lightspeed-operator
    default-branch: main
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            irrelevant-files: &irrelevant-files
              - ^.*\.md$
              - ^\.\..*$
              - ^\.govulncheck-ignore\.yaml$
              - ^docs/.*$
              - ^LICENSE$
              - ^OWNERS$
              - ^OWNERS_ALIASES$
              - ^PROJECT$
              - ^README.md$
              - ^tests?\/functional
              - ^roles/.*/molecule/.*
        - lightspeed-operator-deployment-crc:
            voting: false
            irrelevant-files: *irrelevant-files
        - lightspeed-operator-kuttl:
            irrelevant-files: *irrelevant-files
